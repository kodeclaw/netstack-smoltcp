[package]
name = "netstack-smoltcp"
version = "0.3.1"
edition = "2024"
authors = ["cavivie <cavivie@gmail.com>", "Antigravity"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/kodeclaw/netstack-smoltcp"
homepage = "https://github.com/kodeclaw/netstack-smoltcp"
documentation = "https://docs.rs/netstack-smoltcp"
keywords = ["netstack", "smoltcp", "network", "ip", "tun"]
categories = ["network-programming"]
description = """
A netstack for the special purpose of turning packets from/to a TUN interface
into TCP streams and UDP packets. It uses smoltcp-rs as the backend netstack.
"""
rust-version = "1.91.0"

[dependencies]
tracing = { version = "0.1", default-features = false, features = ["std"] }
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.18"
etherparse = "0.20"
futures = "0.3"
rand = "0.10"
smoltcp = { version = "0.13", default-features = false, features = [
    "std",
    "log",
    "medium-ip",
    "proto-ipv4",
    "proto-ipv6",
    "socket-icmp",
    "socket-udp",
    "socket-tcp",
] }
bytes = "1.11.1"
parking_lot = "0.12.5"

[dev-dependencies]
tun2 = { version = "4", features = ["async"] }
# has better performance on linux than tun2
tun-rs = { version = "2", features = ["async", "async_framed"] } 
tokio = { version = "1", features = [
    "rt",
    "macros",
    "rt-multi-thread",
    "io-util",
] }
tracing = { version = "0.1", default-features = false, features = ["std"] }
tracing-subscriber = "0.3.23"
structopt = "0.3"
socket2 = "0.5.10"
socket2-ext = { version = "0.1" }
